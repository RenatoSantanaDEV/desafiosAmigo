<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Desafio 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Desafio 3/assets/style.css" />
</head>
<body>
    <div class="container-fluid p-4">
        <nav class="row mb-4">
            <div class="col">
                <h1 class="text-white">Dashboard</h1>
            </div>
        </nav>
        
        <div class="row row-cols-1 row-cols-md-6 g-6 mb-4">
            <div id="carouselPrice" class="col"></div>
            <div id="carouselLiquidPrice" class="col"></div>
            <div id="carouselReceivedValue" class="col"></div>
            <div id="carouselNotReceived" class="col"></div>
            <div id="carouselProcedureAttendance" class="col"></div>
            <div id="carouselProcedureFinance" class="col"></div>
        </div>

        <div class="container-fluid p-4">
            <div class="mb-4" id="select-div">
              <select class="form-select form-select-lg" aria-label=".form-select-lg example" style="width: 180px; height: 40px; font-size: 14px;" id="P_SELECT" onchange="chartByKey()">
                <option value="0" selected>Selecione</option>
                <option value="procedure_id">Procedure id</option>
                <option value="group_key">Group Key</option>
                <option value="attendance_id">Attendance id</option>
                <option value="finance_id">Finance id</option>
                <option value="tiss_type">Tipo da guia</option>
              </select>
              <i class="fa-solid fa-filter"></i>
            </div>

            <div class="row">
              <div class="col-md-6 mb-4">
                <div class="card p-3">
                  <h5>Principais Contadores</h5>
                  <canvas id="chart-line" class="chart" style="height: 300px !important;"></canvas>
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                  <div class="card p-3" style="max-width: 100%;">
                      <h5>Contadores por tipo</h5>
                      <canvas id="chart-line-2" class="chart" style="height: 300px;"></canvas>
                  </div>
              </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <script src="../Desafio 3/assets/script.js"></script>
</body>
</html>
